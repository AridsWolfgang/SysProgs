<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>SysProgs — Study</title>
<meta name="theme-color" content="#0f1115"/>
<link rel="manifest" href="./manifest.json"/>
<link rel="stylesheet" href="./css/tokens.css"/>
<link rel="stylesheet" href="./css/components.css"/>
<link rel="stylesheet" href="./css/style.css"/>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/themes/prism-tomorrow.min.css"/>
</head>
<body>
<div class="app">
  <aside id="sidebar" class="sidebar">
    <div class="side-head">
      <a href="#home" class="brand" style="display:flex;align-items:center;gap:8px;text-decoration:none">
        <svg width="20" height="25" viewBox="0 0 240 300" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><path d="M180 240H60V120H180V240Z" fill="var(--accent)"/><path d="M180 60H60V240H180V60ZM240 300H0V0H240V300Z" fill="var(--text)"/></svg>
        <span><span style="color:var(--text)">Sys</span><span style="color:var(--accent)">Progs</span> <b>STUDY</b></span>
      </a>
      <button id="closeSide" class="iconbtn">✕</button>
    </div>
    <div class="side-search">
      <div style="position:relative;flex:1">
        <input id="q" placeholder="Search" autocomplete="off"/>
        <button id="clearQ" class="hidden" style="position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:var(--border);color:var(--muted);border-radius:999px;width:20px;height:20px;cursor:pointer;font-size:12px">✕</button>
      </div>
    </div>
    <div id="searchMeta" style="font:500 11px var(--font-mono);color:var(--faint);padding:0 2px"></div>
    <nav id="sideNav" class="side-nav"></nav>
    <div class="side-foot">
      <div class="progress"><i id="progBar" style="width:0%"></i></div>
      <small id="progText" style="color:var(--muted);font:11px var(--font-mono)">0 / 16</small>
      <div class="row" style="margin-top:8px"><button class="btn small" id="themeBtn">◐ Theme</button><button class="btn small" id="installBtn" style="display:none">⤓ Install</button></div>
    </div>
  </aside>
  <div class="main-wrap">
    <header class="topbar">
      <button id="openSide" class="iconbtn">☰</button>
      <a href="#home" aria-label="Home" style="display:flex;align-items:center;gap:8px;text-decoration:none"><svg width="20" height="25" viewBox="0 0 240 300" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M180 240H60V120H180V240Z" fill="var(--accent)"/><path d="M180 60H60V240H180V60ZM240 300H0V0H240V300Z" fill="var(--text)"/></svg><span class="brand" style="font-size:14px"><span style="color:var(--text)">Sys</span><span style="color:var(--accent)">Progs</span></span></a>
      <nav class="topnav" aria-label="Primary" style="display:flex;gap:16px;margin-left:14px;font:500 13px var(--font-sans)">
        <a href="#home">Learn</a>
        <a href="#progress">Progress</a>
        <a href="./design.html">System</a>
        <a href="https://github.com/anomalyco/opencode" target="_blank" style="opacity:.7">GitHub ↗</a>
      </nav>
      <div class="crumbs" id="crumbs" style="flex:1;text-align:center">Learn / Overview</div>
      <div class="top-actions" style="display:flex;gap:8px;align-items:center">
        <code class="hidden" style="font:11px var(--font-mono);background:var(--surface);border:1px solid var(--border);padding:6px 8px;border-radius:8px">python -m http.server --directory web</code>
        <button class="btn small" onclick="copyText('python -m http.server 8000 --directory web')">⎘ Copy</button>
      </div>
    </header>
    <div class="content-grid">
      <main class="main">
        <div id="view-home"></div>
        <div id="view-module" class="hidden"></div>
        <div id="view-progress" class="hidden"></div>
      </main>
      <aside id="toc" class="toc hidden"></aside>
    </div>
  </div>
</div>
<nav class="nav mobile-only">
  <button data-tab="home" class="active"><i>◧</i>Learn</button>
  <button data-tab="module"><i>≡</i>Read</button>
  <button data-tab="progress"><i>◎</i>Progress</button>
</nav>
<div id="overlay" class="overlay hidden"></div>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/prism-core.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
<script>Prism.plugins.autoloader.languages_path='https://cdn.jsdelivr.net/npm/prismjs@1.29.0/components/';</script>
<script src="./js/app.js"></script>
<script src="./js/interactive.js"></script>
<script>if('serviceWorker' in navigator){ navigator.serviceWorker.register('./sw.js'); }</script>
</body>
</html>
