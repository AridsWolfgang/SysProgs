<svg xmlns="http://www.w3.org/2000/svg" width="720" height="160" viewBox="0 0 720 160">
  <rect width="720" height="160" rx="12" fill="#0f1115" stroke="#242a36"/>
  <text x="360" y="20" text-anchor="middle" fill="#9aa3b2" font-family="Inter" font-size="11">RUST OWNERSHIP — COMPILE-TIME OS</text>
  <rect x="40" y="35" width="200" height="100" rx="10" fill="#171a21" stroke="#6ee7b7"/><text x="140" y="55" text-anchor="middle" fill="#6ee7b7" font-weight="600">let s = String::from("hi")</text><text x="140" y="75" text-anchor="middle" fill="#e6e8eb" font-size="11">one owner — s</text><text x="140" y="95" fill="#9aa3b2" font-size="10">move: let t = s; // s invalid</text><text x="140" y="112" fill="#6b7383" font-size="9">borrow: &s, &mut s checked</text>
  <text x="260" y="85" fill="#60a5fa" font-size="18">→</text>
  <rect x="280" y="35" width="200" height="100" rx="10" fill="#12151d" stroke="#60a5fa"/><text x="380" y="55" text-anchor="middle" fill="#60a5fa" font-weight="600">Borrow checker</text><text x="380" y="75" text-anchor="middle" fill="#e6e8eb" font-size="10">compile error, not runtime</text><text x="380" y="95" fill="#9aa3b2" font-size="10">no use-after-free</text><text x="380" y="112" fill="#9aa3b2" font-size="10">no data race (Send/Sync)</text>
  <rect x="500" y="35" width="180" height="100" rx="10" fill="#0b0e13" stroke="#fbbf24"/><text x="590" y="55" text-anchor="middle" fill="#fbbf24" font-weight="600">unsafe { }</text><text x="590" y="75" text-anchor="middle" fill="#e6e8eb" font-size="10">raw *mut, libc::read</text><text x="590" y="95" fill="#9aa3b2" font-size="10">you promise safety</text><text x="590" y="112" fill="#6b7383" font-size="9">boundary explicit</text>
</svg>