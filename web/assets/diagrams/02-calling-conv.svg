<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240">
  <rect width="720" height="240" rx="12" fill="#0f1115" stroke="#242a36"/>
  <text x="360" y="20" text-anchor="middle" fill="#9aa3b2" font-family="Inter" font-size="11" letter-spacing="0.6">CALLING CONVENTIONS — WHERE ARGS LIVE</text>
  <g font-family="Inter" font-size="11">
    <rect x="20" y="35" width="165" height="180" rx="10" fill="#171a21" stroke="#60a5fa"/><text x="102" y="55" text-anchor="middle" fill="#60a5fa" font-weight="600">SysV AMD64</text><text x="30" y="75" fill="#e6e8eb" font-size="10">int: rdi rsi rdx rcx r8 r9</text><text x="30" y="92" fill="#9aa3b2" font-size="10">float: xmm0-7</text><text x="30" y="109" fill="#9aa3b2" font-size="10">ret: rax / xmm0</text><text x="30" y="130" fill="#6ee7b7" font-size="9">red zone 128B below rsp</text><text x="30" y="148" fill="#6b7383" font-size="9">caller: rax rcx rdx</text><text x="30" y="162" fill="#6b7383" font-size="9">callee: rbx rbp r12-15</text><text x="30" y="180" fill="#fbbf24" font-size="9">7th arg → stack [rsp+8]</text>
    <rect x="195" y="35" width="165" height="180" rx="10" fill="#171a21" stroke="#242a36"/><text x="277" y="55" text-anchor="middle" fill="#e6e8eb" font-weight="600">Win64</text><text x="205" y="75" fill="#e6e8eb" font-size="10">int: rcx rdx r8 r9</text><text x="205" y="92" fill="#9aa3b2" font-size="10">float: xmm0-3</text><text x="205" y="109" fill="#9aa3b2" font-size="10">ret: rax</text><text x="205" y="130" fill="#6ee7b7" font-size="9">shadow 32B above ret</text><text x="205" y="148" fill="#6b7383" font-size="9">callee: rbx rbp rsi rdi</text><text x="205" y="180" fill="#fbbf24" font-size="9">5th arg → stack</text>
    <rect x="370" y="35" width="165" height="180" rx="10" fill="#171a21" stroke="#242a36"/><text x="452" y="55" text-anchor="middle" fill="#e6e8eb" font-weight="600">AAPCS64 (ARM)</text><text x="380" y="75" fill="#e6e8eb" font-size="10">int: x0-x7</text><text x="380" y="92" fill="#9aa3b2" font-size="10">float: v0-v7</text><text x="380" y="109" fill="#9aa3b2" font-size="10">ret: x0 / v0</text><text x="380" y="130" fill="#6b7383" font-size="9">callee: x19-x28</text><text x="380" y="148" fill="#6b7383" font-size="9">stack 16B align</text>
    <rect x="545" y="35" width="155" height="180" rx="10" fill="#171a21" stroke="#242a36"/><text x="622" y="55" text-anchor="middle" fill="#e6e8eb" font-weight="600">RISC-V</text><text x="555" y="75" fill="#e6e8eb" font-size="10">int: a0-a7</text><text x="555" y="92" fill="#9aa3b2" font-size="10">float: fa0-fa7</text><text x="555" y="109" fill="#9aa3b2" font-size="10">ret: a0</text><text x="555" y="130" fill="#6b7383" font-size="9">callee: s0-s11</text><text x="555" y="148" fill="#6b7383" font-size="9">zero x0</text>
  </g>
  <text x="360" y="230" text-anchor="middle" fill="#9aa3b2" font-size="9">Mismatch = silent corruption. FFI (Python ctypes, Rust extern C, Go cgo) must match ABI exactly.</text>
</svg>