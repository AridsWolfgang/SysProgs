<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220">
  <rect width="720" height="220" rx="12" fill="#0f1115" stroke="#242a36"/>
  <text x="360" y="20" text-anchor="middle" fill="#9aa3b2" font-family="Inter,sans-serif" font-size="11" letter-spacing="0.6">SYSCALL LAYERS</text>
  <rect x="40" y="40" width="150" height="50" rx="10" fill="#171a21" stroke="#2e364a"/><text x="115" y="60" text-anchor="middle" fill="#e6e8eb" font-family="Inter" font-size="12" font-weight="600">Your code</text><text x="115" y="78" text-anchor="middle" fill="#9aa3b2" font-size="10">printf("hello")</text>
  <rect x="210" y="40" width="150" height="50" rx="10" fill="#171a21" stroke="#2e364a"/><text x="285" y="60" text-anchor="middle" fill="#e6e8eb" font-size="12" font-weight="600">C library</text><text x="285" y="78" text-anchor="middle" fill="#9aa3b2" font-size="10">fwrite -&gt; write</text>
  <rect x="380" y="40" width="150" height="50" rx="10" fill="#12151d" stroke="#60a5fa"/><text x="455" y="60" text-anchor="middle" fill="#60a5fa" font-size="12" font-weight="600">Syscall trap</text><text x="455" y="78" text-anchor="middle" fill="#9aa3b2" font-size="10">syscall / svc / ecall</text>
  <rect x="550" y="40" width="130" height="50" rx="10" fill="#0b0e13" stroke="#6ee7b7"/><text x="615" y="60" text-anchor="middle" fill="#6ee7b7" font-size="12" font-weight="600">Kernel</text><text x="615" y="78" text-anchor="middle" fill="#9aa3b2" font-size="10">files / proc / net</text>
  <line x1="190" y1="65" x2="210" y2="65" stroke="#60a5fa" stroke-width="1.5"/><line x1="360" y1="65" x2="380" y2="65" stroke="#60a5fa" stroke-width="1.5"/><line x1="530" y1="65" x2="550" y2="65" stroke="#6ee7b7" stroke-width="1.5"/>
  <rect x="40" y="115" width="640" height="85" rx="10" fill="#171a21" stroke="#242a36"/><text x="60" y="135" fill="#e6e8eb" font-size="11" font-family="Inter" font-weight="600">Why two paths?</text><text x="60" y="155" fill="#9aa3b2" font-size="11">HIGH: FILE* buffered, portable — fwrite -&gt; kernel buffers you.</text><text x="60" y="172" fill="#9aa3b2" font-size="11">LOW: fd raw handle — you buffer, you control every byte. Prove with strace.</text><text x="60" y="189" fill="#6ee7b7" font-size="10">Lab: printf vs write(1,…) — same screen, different trace.</text>
</svg>