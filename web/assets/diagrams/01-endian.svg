<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180">
  <rect width="720" height="180" rx="12" fill="#0f1115" stroke="#242a36"/>
  <text x="360" y="20" text-anchor="middle" fill="#9aa3b2" font-family="Inter" font-size="11">ENDIANNESS — 0x01020304 IN RAM</text>
  <text x="180" y="45" text-anchor="middle" fill="#e6e8eb" font-weight="600">Little-endian (x86)</text>
  <g font-family="JetBrains Mono, monospace" font-size="12">
    <rect x="60" y="60" width="60" height="40" rx="6" fill="#0b0e13" stroke="#6ee7b7"/><text x="90" y="85" text-anchor="middle" fill="#6ee7b7">04</text><text x="90" y="105" text-anchor="middle" fill="#6b7383" font-size="9">addr 0</text>
    <rect x="120" y="60" width="60" height="40" rx="6" fill="#171a21" stroke="#2e364a"/><text x="150" y="85" text-anchor="middle" fill="#e6e8eb">03</text><text x="150" y="105" text-anchor="middle" fill="#6b7383" font-size="9">addr 1</text>
    <rect x="180" y="60" width="60" height="40" rx="6" fill="#171a21" stroke="#2e364a"/><text x="210" y="85" text-anchor="middle" fill="#e6e8eb">02</text><text x="210" y="105" text-anchor="middle" fill="#6b7383" font-size="9">addr 2</text>
    <rect x="240" y="60" width="60" height="40" rx="6" fill="#171a21" stroke="#2e364a"/><text x="270" y="85" text-anchor="middle" fill="#e6e8eb">01</text><text x="270" y="105" text-anchor="middle" fill="#6b7383" font-size="9">addr 3</text>
  </g>
  <text x="180" y="135" text-anchor="middle" fill="#6ee7b7" font-size="11">LSB first — your laptop</text>
  <text x="540" y="45" text-anchor="middle" fill="#e6e8eb" font-weight="600">Big-endian (network)</text>
  <g font-family="JetBrains Mono, monospace" font-size="12">
    <rect x="420" y="60" width="60" height="40" rx="6" fill="#0b0e13" stroke="#60a5fa"/><text x="450" y="85" text-anchor="middle" fill="#60a5fa">01</text><text x="450" y="105" text-anchor="middle" fill="#6b7383" font-size="9">addr 0</text>
    <rect x="480" y="60" width="60" height="40" rx="6" fill="#171a21" stroke="#2e364a"/><text x="510" y="85" text-anchor="middle" fill="#e6e8eb">02</text>
    <rect x="540" y="60" width="60" height="40" rx="6" fill="#171a21" stroke="#2e364a"/><text x="570" y="85" text-anchor="middle" fill="#e6e8eb">03</text>
    <rect x="600" y="60" width="60" height="40" rx="6" fill="#171a21" stroke="#2e364a"/><text x="630" y="85" text-anchor="middle" fill="#e6e8eb">04</text>
  </g>
  <text x="540" y="135" text-anchor="middle" fill="#60a5fa" font-size="11">MSB first — network order</text>
  <text x="360" y="165" text-anchor="middle" fill="#9aa3b2" font-size="10">Always store network order: htonl() before fwrite, ntohl() after fread.</text>
</svg>