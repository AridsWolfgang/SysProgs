<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180">
  <rect width="720" height="180" rx="12" fill="#0f1115" stroke="#242a36"/>
  <text x="360" y="20" text-anchor="middle" fill="#9aa3b2" font-family="Inter" font-size="11">RAII vs MANUAL — ZERO-COST</text>
  <rect x="40" y="35" width="320" height="120" rx="10" fill="#171a21" stroke="#fbbf24"/><text x="200" y="55" text-anchor="middle" fill="#fbbf24" font-weight="600">C — Manual</text><text x="60" y="75" fill="#e6e8eb" font-family="JetBrains Mono, monospace" font-size="10">FILE *f = fopen(...);</text><text x="60" y="92" fill="#e6e8eb" font-family="JetBrains Mono" font-size="10">if (err) return; // leak!</text><text x="60" y="109" fill="#e6e8eb" font-family="JetBrains Mono" font-size="10">fclose(f); // you close</text><text x="60" y="130" fill="#9aa3b2" font-size="10">forgets, early returns, exceptions → leak</text>
  <rect x="380" y="35" width="300" height="120" rx="10" fill="#12151d" stroke="#6ee7b7"/><text x="530" y="55" text-anchor="middle" fill="#6ee7b7" font-weight="600">C++ — RAII</text><text x="400" y="75" fill="#e6e8eb" font-family="JetBrains Mono" font-size="10">{ std::ofstream f(...);</text><text x="400" y="92" fill="#e6e8eb" font-family="JetBrains Mono" font-size="10">  f &lt;&lt; "hi"; } // dtor closes</text><text x="400" y="109" fill="#6ee7b7" font-size="10">no leak, even on throw</text><text x="400" y="130" fill="#9aa3b2" font-size="10">objdump shows same ASM as C — zero-cost</text>
</svg>