<svg xmlns="http://www.w3.org/2000/svg" width="720" height="180" viewBox="0 0 720 180">
  <rect width="720" height="180" rx="12" fill="#0f1115" stroke="#242a36"/>
  <text x="360" y="20" text-anchor="middle" fill="#9aa3b2" font-family="Inter" font-size="11">CONCURRENCY — LOCKS vs LOCK-FREE vs ASYNC</text>
  <g font-family="Inter" font-size="10">
    <rect x="20" y="35" width="220" height="120" rx="10" fill="#171a21" stroke="#fbbf24"/><text x="130" y="55" text-anchor="middle" fill="#fbbf24" font-weight="600">Threads + Locks</text><text x="30" y="75" fill="#e6e8eb">mutex, rwlock, condvar</text><text x="30" y="92" fill="#9aa3b2">futex → kernel sleep</text><text x="30" y="109" fill="#6b7383">easy, can deadlock</text>
    <rect x="250" y="35" width="220" height="120" rx="10" fill="#12151d" stroke="#6ee7b7"/><text x="360" y="55" text-anchor="middle" fill="#6ee7b7" font-weight="600">Lock-free</text><text x="260" y="75" fill="#e6e8eb">CAS loop, ABA</text><text x="260" y="92" fill="#9aa3b2">atomic acquire/release</text><text x="260" y="109" fill="#6b7383">x86 TSO vs ARM weak</text>
    <rect x="480" y="35" width="220" height="120" rx="10" fill="#171a21" stroke="#60a5fa"/><text x="590" y="55" text-anchor="middle" fill="#60a5fa" font-weight="600">Async (epoll/io_uring)</text><text x="490" y="75" fill="#e6e8eb">one thread, 10K conns</text><text x="490" y="92" fill="#9aa3b2">readiness vs completion</text><text x="490" y="109" fill="#6b7383">tokio, goroutines M:N</text>
  </g>
</svg>