<svg xmlns="http://www.w3.org/2000/svg" width="720" height="140" viewBox="0 0 720 140">
  <rect width="720" height="140" rx="12" fill="#0f1115" stroke="#242a36"/>
  <text x="360" y="20" text-anchor="middle" fill="#9aa3b2" font-family="Inter" font-size="11">C COMPILATION PIPELINE</text>
  <g font-family="Inter" font-size="11">
    <rect x="30" y="35" width="110" height="60" rx="10" fill="#171a21" stroke="#2e364a"/><text x="85" y="60" text-anchor="middle" fill="#e6e8eb" font-weight="600">hello.c</text><text x="85" y="78" text-anchor="middle" fill="#9aa3b2" font-size="9">+ headers</text>
    <text x="150" y="70" fill="#60a5fa">→</text><text x="150" y="85" fill="#6b7383" font-size="8">cpp</text>
    <rect x="165" y="35" width="110" height="60" rx="10" fill="#171a21" stroke="#2e364a"/><text x="220" y="60" text-anchor="middle" fill="#e6e8eb" font-weight="600">hello.i</text><text x="220" y="78" text-anchor="middle" fill="#9aa3b2" font-size="9">gcc -E</text>
    <text x="285" y="70" fill="#60a5fa">→</text><text x="285" y="85" fill="#6b7383" font-size="8">cc1</text>
    <rect x="300" y="35" width="110" height="60" rx="10" fill="#171a21" stroke="#60a5fa"/><text x="355" y="60" text-anchor="middle" fill="#60a5fa" font-weight="600">hello.s</text><text x="355" y="78" text-anchor="middle" fill="#9aa3b2" font-size="9">gcc -S -O2</text>
    <text x="420" y="70" fill="#60a5fa">→</text><text x="420" y="85" fill="#6b7383" font-size="8">as</text>
    <rect x="435" y="35" width="110" height="60" rx="10" fill="#171a21" stroke="#2e364a"/><text x="490" y="60" text-anchor="middle" fill="#e6e8eb" font-weight="600">hello.o</text><text x="490" y="78" text-anchor="middle" fill="#9aa3b2" font-size="9">nasm / as</text>
    <text x="555" y="70" fill="#60a5fa">→</text><text x="555" y="85" fill="#6b7383" font-size="8">ld</text>
    <rect x="570" y="35" width="110" height="60" rx="10" fill="#0b0e13" stroke="#6ee7b7"/><text x="625" y="60" text-anchor="middle" fill="#6ee7b7" font-weight="600">hello.exe</text><text x="625" y="78" text-anchor="middle" fill="#9aa3b2" font-size="9">linked</text>
  </g>
  <text x="360" y="120" text-anchor="middle" fill="#9aa3b2" font-size="10">Read the .s — that's what 02 taught you. -O2 changes it completely.</text>
</svg>